services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_prep_platform
      POSTGRES_USER: test_prep
      POSTGRES_PASSWORD: test_prep_local
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_prep -d test_prep_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
